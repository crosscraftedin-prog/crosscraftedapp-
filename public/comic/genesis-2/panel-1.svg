  <text x="600" y="300" text-anchor="middle" fill="#F39B9B" font-family="serif" font-size="72" font-weight="bold" opacity="0.8"> seventh day</text>
  <text x="600" y="380" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="24">God rested from all His work</text>
  <text x="600" y="620" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="16">Believ · Genesis 2:1-3</text>
